<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 7</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>personal information</legend>
        <!--submit-->
        <label for="firstname">First Name</label>
        <br>
        <input type="text" id="firstname" name="firstname">
        <br>

        <label for="lastname">Last Name</label>
        <br>
        <input type="text" id="lastname" name="lastname">
        <br>

        <label for="email">Email</label>
        <br>
        <input type="text" id="email" name="email">
        <br>

        <label for="password">Password</label>
        <br>
        <input type="text" id="password" name="password">
        <br><br>

        
        <!--radio-->
        <label>Gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="male"> 
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female"> 
        <label for="female">Female</label>
        <br><br>

        <!--checkbox-->

        <label>Hobbies:</label>
        <br>
        <input type="checkbox" id="gaming" name="gaming" value="Gaming">
        <label for="gaming">Gaming</label>
        <br>

        <input type="checkbox" id="football" name="football" value="Football">
        <label for="football">Football</label>
        <br>

        <input type="checkbox" id="swimming" name="swimming" value="Swimming">
        <label for="swimming">Swimming</label>
        <br>

        <!--select-->

        <label>Choose your pet:</label>
        <select name="pet" id="pet">
            <option value="cat">Cat</option>
            <option value="dog">Dog</option>
            <option value="parrot">Parrot</option>
            </select>


        <!--text-->
        
        <textarea name="message" rows="10" cols="20"></textarea>
        <br><br>

        <input type="submit" id="submit" name="submit">
        <br><br>
        </fieldset>
    </form>

        <hr>
        <br>

        <!--semantics-->

        <article>
            <h2>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sunt deserunt autem optio, 
                quis dolorem maxime veritatis, omnis soluta assumenda 
                libero quibusdam animi quae laboriosam repellendus quasi voluptate delectus illo aspernatur!</h2>

                <p> i got left behind</p>

</body>
</html>
